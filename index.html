<script type="text/babel">
  // ===== Хранилище контента: content.json → localStorage → состояние React =====
  const STORAGE_KEY = "bt_content_v1";
  const SESSION_KEY = "bt_admin_session";

  // Компактная реализация SHA-256 (crypto.subtle недоступен при открытии файла с диска).
  function sha256(ascii) {
    function rightRotate(value, amount) {
      return (value >>> amount) | (value << (32 - amount));
    }
    const mathPow = Math.pow;
    const maxWord = mathPow(2, 32);
    let i, j, result = "";
    const words = [];
    const asciiBitLength = ascii.length * 8;

    let hash = (sha256.h = sha256.h || []);
    const k = (sha256.k = sha256.k || []);
    let primeCounter = k.length;

    const isComposite = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }

    ascii += "\x80";
    while ((ascii.length % 64) - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return "";
      words[i >> 2] |= j << (((3 - i) % 4) * 8);
    }
    words[words.length] = (asciiBitLength / maxWord) | 0;
    words[words.length] = asciiBitLength;

    for (j = 0; j < words.length; ) {
      const w = words.slice(j, (j += 16));
      const oldHash = hash;
      hash = hash.slice(0, 8);

      for (i = 0; i < 64; i++) {
        const w15 = w[i - 15];
        const w2 = w[i - 2];
        const a = hash[0];
        const e = hash[4];
        const temp1 =
          hash[7] +
          (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
          ((e & hash[5]) ^ (~e & hash[6])) +
          k[i] +
          (w[i] =
            i < 16
              ? w[i]
              : (w[i - 16] +
                  (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                  w[i - 7] +
                  (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                0);
        const temp2 =
          (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
          ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }

      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }

    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        const b = (hash[i] >> (j * 8)) & 255;
        result += (b < 16 ? 0 : "") + b.toString(16);
      }
    }
    return result;
  }

  function hashPassword(pass) {
    // UTF-8, чтобы кириллический пароль тоже считался.
    return sha256(unescape(encodeURIComponent(String(pass))));
  }

  const clone = (o) => JSON.parse(JSON.stringify(o));

  // Глубокое слияние: недостающие поля берём из значений по умолчанию.
  function merge(base, patch) {
    if (Array.isArray(base) || Array.isArray(patch)) return patch === undefined ? base : patch;
    if (base && typeof base === "object" && patch && typeof patch === "object") {
      const out = {};
      Object.keys(base).forEach((key) => (out[key] = merge(base[key], patch[key])));
      Object.keys(patch).forEach((key) => { if (!(key in out)) out[key] = patch[key]; });
      return out;
    }
    return patch === undefined ? base : patch;
  }

  async function loadContent() {
    let base = clone(window.DEFAULT_CONTENT);
    // content.json рядом с сайтом (после выгрузки из панели) — источник для всех посетителей.
    try {
      const res = await fetch("content.json", { cache: "no-store" });
      if (res.ok) base = merge(base, await res.json());
    } catch (e) {
      /* открыт с диска или файла нет — работаем на значениях по умолчанию */
    }
    // Локальный черновик этого браузера перекрывает всё.
    let local = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) local = JSON.parse(raw);
    } catch (e) {
      /* повреждённый черновик игнорируем */
    }
    return { content: local ? merge(base, local) : base, published: base, hasLocal: !!local };
  }

  window.Store = { STORAGE_KEY, SESSION_KEY, hashPassword, sha256, clone, merge, loadContent };
</script>

<script type="text/babel">
  const FADE_MS = 500;

  function KenBurns({ slides, className = "", style, objectPos = "object-center", holdMs = 6500 }) {
    const layers = React.useRef([]);
    const rafs = React.useRef({});
    const current = React.useRef(0);

    React.useEffect(() => {
      const fadeTo = (el, key, target, duration) => {
        if (!el) return;
        if (rafs.current[key]) cancelAnimationFrame(rafs.current[key]);
        const from = parseFloat(el.style.opacity || "0");
        const start = performance.now();
        const step = (now) => {
          const p = Math.min(1, (now - start) / duration);
          el.style.opacity = String(from + (target - from) * p);
          if (p < 1) rafs.current[key] = requestAnimationFrame(step);
          else delete rafs.current[key];
        };
        rafs.current[key] = requestAnimationFrame(step);
      };

      current.current = 0;
      layers.current.forEach((el) => { if (el) el.style.opacity = "0"; });
      const first = layers.current[0];
      if (first) {
        if (first.complete) fadeTo(first, 0, 1, FADE_MS);
        else first.addEventListener("load", () => fadeTo(first, 0, 1, FADE_MS), { once: true });
      }

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let timer = null;
      if (!reduce && slides.length > 1) {
        timer = setInterval(() => {
          const cur = current.current;
          const next = (cur + 1) % slides.length;
          fadeTo(layers.current[cur], cur, 0, FADE_MS);
          fadeTo(layers.current[next], next, 1, FADE_MS);
          current.current = next;
        }, holdMs);
      }

      const rafStore = rafs.current;
      return () => {
        if (timer) clearInterval(timer);
        Object.keys(rafStore).forEach((key) => cancelAnimationFrame(rafStore[key]));
      };
    }, [slides, holdMs]);

    return (
      <div className={"absolute overflow-hidden " + className} style={style}>
        {slides.map((src, i) => (
          <img
            key={src + i}
            ref={(el) => (layers.current[i] = el)}
            src={src}
            alt=""
            aria-hidden="true"
            className={"absolute inset-0 w-full h-full object-cover kb-anim " + objectPos}
            style={{ opacity: 0, animationDelay: -(i * 5) + "s" }}
          />
        ))}
      </div>
    );
  }

  window.KenBurns = KenBurns;
</script>

<script type="text/babel">
  const { motion } = window.Motion;

  function BlurText({ text, className = "", delay = 100 }) {
    const ref = React.useRef(null);
    const [inView, setInView] = React.useState(false);

    React.useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const obs = new IntersectionObserver(
        (entries) => {
          if (entries[0].isIntersecting) {
            setInView(true);
            obs.unobserve(el);
          }
        },
        { threshold: 0.1 }
      );
      obs.observe(el);
      return () => obs.disconnect();
    }, []);

    const words = String(text).split(" ");

    return (
      <p
        ref={ref}
        className={className}
        style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}
      >
        {words.map((word, i) => (
          <motion.span
            key={word + i}
            style={{ display: "inline-block", marginRight: "0.28em", willChange: "transform, filter, opacity" }}
            initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
            animate={
              inView
                ? { filter: ["blur(10px)", "blur(5px)", "blur(0px)"], opacity: [0, 0.5, 1], y: [50, -5, 0] }
                : {}
            }
            transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * delay) / 1000 }}
          >
            {word}
          </motion.span>
        ))}
      </p>
    );
  }

  window.BlurText = BlurText;
</script>

<script type="text/babel">
  // ===== Панель управления: /#admin =====
  const { STORAGE_KEY, SESSION_KEY, hashPassword, clone } = window.Store;
  const { Lock } = window.Icons;

  function Field({ label, value, onChange, textarea, rows = 3, placeholder }) {
    return (
      <label className="block">
        <span className="adm-label">{label}</span>
        {textarea ? (
          <textarea
            className="adm-input mt-1.5"
            rows={rows}
            value={value || ""}
            placeholder={placeholder}
            onChange={(e) => onChange(e.target.value)}
          />
        ) : (
          <input
            className="adm-input mt-1.5"
            value={value || ""}
            placeholder={placeholder}
            onChange={(e) => onChange(e.target.value)}
          />
        )}
      </label>
    );
  }

  function StringList({ label, items, onChange, placeholder }) {
    const set = (i, v) => onChange(items.map((x, j) => (j === i ? v : x)));
    const remove = (i) => onChange(items.filter((_, j) => j !== i));
    const add = () => onChange(items.concat(""));
    const move = (i, dir) => {
      const next = items.slice();
      const j = i + dir;
      if (j < 0 || j >= next.length) return;
      const tmp = next[i];
      next[i] = next[j];
      next[j] = tmp;
      onChange(next);
    };
    return (
      <div>
        <span className="adm-label">{label}</span>
        <div className="mt-1.5 space-y-2">
          {items.map((it, i) => (
            <div key={i} className="flex items-center gap-2">
              <input className="adm-input" value={it} placeholder={placeholder} onChange={(e) => set(i, e.target.value)} />
              <button className="adm-btn adm-btn-icon" onClick={() => move(i, -1)} title="Выше">↑</button>
              <button className="adm-btn adm-btn-icon" onClick={() => move(i, 1)} title="Ниже">↓</button>
              <button className="adm-btn adm-btn-icon adm-btn-danger" onClick={() => remove(i)} title="Удалить">✕</button>
            </div>
          ))}
        </div>
        <button className="adm-btn mt-2" onClick={add}>+ Добавить</button>
      </div>
    );
  }

  function ImageList({ label, items, onChange, hint }) {
    const set = (i, v) => onChange(items.map((x, j) => (j === i ? v : x)));
    const remove = (i) => onChange(items.filter((_, j) => j !== i));
    const upload = (i, file) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => set(i, String(reader.result));
      reader.readAsDataURL(file);
    };
    return (
      <div>
        <span className="adm-label">{label}</span>
        {hint ? <p className="text-xs text-white/40 font-body mt-1">{hint}</p> : null}
        <div className="mt-2 space-y-2">
          {items.map((src, i) => (
            <div key={i} className="flex items-center gap-2">
              <img src={src} alt="" className="h-11 w-16 object-cover rounded-lg bg-white/5 shrink-0" />
              <input className="adm-input" value={src.startsWith("data:") ? "(загруженный файл)" : src}
                readOnly={src.startsWith("data:")} onChange={(e) => set(i, e.target.value)} />
              <label className="adm-btn adm-btn-icon cursor-pointer">
                Файл
                <input type="file" accept="image/*" className="hidden" onChange={(e) => upload(i, e.target.files[0])} />
              </label>
              <button className="adm-btn adm-btn-icon adm-btn-danger" onClick={() => remove(i)} title="Удалить">✕</button>
            </div>
          ))}
        </div>
        <button className="adm-btn mt-2" onClick={() => onChange(items.concat("assets/"))}>+ Добавить фото</button>
      </div>
    );
  }

  function PriceEditor({ items, onChange }) {
    const set = (i, key, v) => onChange(items.map((x, j) => (j === i ? Object.assign({}, x, { [key]: v }) : x)));
    const remove = (i) => onChange(items.filter((_, j) => j !== i));
    const move = (i, dir) => {
      const next = items.slice();
      const j = i + dir;
      if (j < 0 || j >= next.length) return;
      const tmp = next[i];
      next[i] = next[j];
      next[j] = tmp;
      onChange(next);
    };
    const add = () => onChange(items.concat({ t: "Новая программа", d: "", p: "0 ₽", x: "", r: "" }));

    return (
      <div className="space-y-4">
        {items.map((it, i) => (
          <div key={i} className="rounded-2xl border border-white/10 bg-white/[0.03] p-4">
            <div className="flex items-center justify-between gap-2 mb-3">
              <span className="text-xs text-white/40 font-body">№ {i + 1}</span>
              <div className="flex items-center gap-2">
                <button className="adm-btn adm-btn-icon" onClick={() => move(i, -1)}>↑</button>
                <button className="adm-btn adm-btn-icon" onClick={() => move(i, 1)}>↓</button>
                <button className="adm-btn adm-btn-icon adm-btn-danger" onClick={() => remove(i)}>Удалить</button>
              </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
              <div className="md:col-span-6">
                <Field label="Название" value={it.t} onChange={(v) => set(i, "t", v)} />
              </div>
              <div className="md:col-span-3">
                <Field label="Длительность" value={it.d} onChange={(v) => set(i, "d", v)} placeholder="60 мин" />
              </div>
              <div className="md:col-span-3">
                <Field label="Цена" value={it.p} onChange={(v) => set(i, "p", v)} placeholder="4 000 ₽" />
              </div>
              <div className="md:col-span-12">
                <Field label="Описание" value={it.x} onChange={(v) => set(i, "x", v)} textarea rows={2} />
              </div>
              <div className="md:col-span-12">
                <Field label="Результат (необязательно)" value={it.r} onChange={(v) => set(i, "r", v)} textarea rows={2} />
              </div>
            </div>
          </div>
        ))}
        <button className="adm-btn adm-btn-primary" onClick={add}>+ Добавить программу</button>
      </div>
    );
  }

  function Login({ content, onOk }) {
    const [user, setUser] = React.useState("");
    const [pass, setPass] = React.useState("");
    const [error, setError] = React.useState("");

    const submit = (e) => {
      e.preventDefault();
      const ok = user.trim() === content.auth.user && hashPassword(pass) === content.auth.hash;
      if (ok) {
        sessionStorage.setItem(SESSION_KEY, "1");
        onOk();
      } else {
        setError("Неверный логин или пароль");
      }
    };

    return (
      <div className="min-h-screen bg-plum flex items-center justify-center px-4">

          <h1 className="font-heading italic text-white text-3xl mt-5 leading-none">Панель управления</h1>

            <Field label="Логин" value={user} onChange={setUser} />
            <label className="block">
              <span className="adm-label">Пароль</span>
              <input type="password" className="adm-input mt-1.5" value={pass} onChange={(e) => setPass(e.target.value)} />
            </label>
          </div>

          {error ? <p className="text-sm text-red-300 font-body mt-3">{error}</p> : null}

          <button type="submit" className="adm-btn adm-btn-primary w-full mt-5">Войти</button>

          </a>
        </form>
      </div>
    );
  }

  const TABS = [
    { id: "hero", label: "Главная" },
    { id: "services", label: "Услуги" },
    { id: "pricing", label: "Прайс" },

    { id: "promo", label: "Сертификат" },
    { id: "contacts", label: "Контакты" },
    { id: "access", label: "Доступ" },

  function Admin({ content, published, hasLocal, onApply, onDropLocal }) {
    const [authed, setAuthed] = React.useState(sessionStorage.getItem(SESSION_KEY) === "1");
    const [draft, setDraft] = React.useState(() => clone(content));

    const [toast, setToast] = React.useState("");
    const [priceTab, setPriceTab] = React.useState("face");

    const say = (msg) => {
      setToast(msg);
      window.setTimeout(() => setToast(""), 2600);
    };

    const upd = (path, value) => {
      setDraft((prev) => {
        const next = clone(prev);
        let node = next;
        for (let i = 0; i < path.length - 1; i++) node = node[path[i]];
        node[path[path.length - 1]] = value;
        return next;
      });
      setDirty(true);
    };

    const save = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
      onApply(draft);
      setDirty(false);
      say("Сохранено в этом браузере. Чтобы увидели все — выгрузите content.json.");
    };

    const download = () => {
      const blob = new Blob([JSON.stringify(draft, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "content.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      say("Файл скачан. Положите его рядом с index.html.");
    };

    const resetToPublished = () => {
      if (!window.confirm("Сбросить локальные правки и вернуться к опубликованной версии?")) return;
      localStorage.removeItem(STORAGE_KEY);
      setDraft(clone(published));
      onDropLocal();
      setDirty(false);

    };

    if (!authed) return <Login content={content} onOk={() => setAuthed(true)} />;

    const h = draft.hero;

    const p = draft.pricing;
    const g = draft.gallery;

    const k = draft.contacts;

    return (

                  <Field label="Изображение" value={b.image.startsWith("data:") ? "(загруженный файл)" : b.image}

          {tab === "contacts" ? (

  function AccessTab({ draft, upd, say }) {
    const [p1, setP1] = React.useState("");
    const [p2, setP2] = React.useState("");

    const change = () => {
      if (p1.length < 6) return say("Пароль должен быть не короче 6 символов.");
      if (p1 !== p2) return say("Пароли не совпадают.");
      upd(["auth", "hash"], hashPassword(p1));
      setP1("");
      setP2("");
      say("Пароль изменён. Нажмите «Сохранить», затем выгрузите content.json.");
    };

    return (

          </label>
          <button className="adm-btn adm-btn-primary" onClick={change}>Изменить пароль</button>

        <div className="rounded-2xl border border-amber-400/30 bg-amber-400/10 p-4 text-sm text-amber-100 leading-relaxed">
          <strong>Насколько это защищено.</strong> Сайт работает без сервера, поэтому проверка пароля происходит
          в браузере, а его хэш лежит в файле сайта. Это закрывает страницу от случайного посетителя, но не от того,
          кто откроет исходный код и станет подбирать пароль. Не используйте здесь пароль, который применяете
          где-то ещё. Если понадобится настоящая защита — нужен сервер, который будет проверять пароль и хранить
          content.json у себя.
        </div>

        <div className="rounded-2xl border border-white/10 bg-white/[0.03] p-4 text-sm text-white/70 leading-relaxed">
          <strong className="text-white">Как правки попадают на сайт.</strong>
          <ol className="list-decimal ml-5 mt-2 space-y-1">
            <li>Меняете тексты и цены во вкладках выше.</li>
            <li>«Сохранить» — правки применяются к сайту в этом браузере.</li>
            <li>«Скачать content.json» — файл кладёте рядом с index.html на хостинге.</li>
            <li>Сайт при загрузке сам подхватит content.json, и правки увидят все посетители.</li>
          </ol>
        </div>
      </div>
    );
  }

  window.Admin = Admin;

<script type="text/babel">
  const { ContentCtx, Site, Admin } = window;
  const { loadContent, STORAGE_KEY } = window.Store;

  function Root() {
    const [state, setState] = React.useState(null);
    const [route, setRoute] = React.useState(window.location.hash);

    React.useEffect(() => {
      loadContent().then(setState);
      const onHash = () => setRoute(window.location.hash);
      window.addEventListener("hashchange", onHash);

      // Мобильные: подсветка плашки по касанию (CSS :hover там не работает).
      let picked = null;
      const onDown = (e) => {
        if (e.pointerType !== "touch" && e.pointerType !== "pen") return;
        const plate = e.target.closest ? e.target.closest(".liquid-glass, .liquid-glass-strong") : null;
        if (picked && picked !== plate) picked.classList.remove("is-active");
        if (plate) {
          plate.classList.add("is-active");
          picked = plate;
        } else {
          picked = null;
        }
      };
      window.addEventListener("pointerdown", onDown, { passive: true });

      return () => {
        window.removeEventListener("hashchange", onHash);
        window.removeEventListener("pointerdown", onDown);
        if (picked) picked.classList.remove("is-active");
      };
    }, []);

    if (!state) return <div className="min-h-screen bg-plum" />;

    if (route === "#admin") {
      return (
        <Admin
          content={state.content}
          published={state.published}
          hasLocal={state.hasLocal}
          onApply={(next) => setState((s) => Object.assign({}, s, { content: next, hasLocal: true }))}
          onDropLocal={() => setState((s) => Object.assign({}, s, { content: s.published, hasLocal: false }))}
        />
      );
    }

    return (
      <ContentCtx.Provider value={state.content}>
        <Site />
      </ContentCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
